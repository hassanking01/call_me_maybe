[project]
name = "call_me_maybe"
version = "0.1.0"
description = "LLM SDK Function Calling Project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "argparse>=1.4.0",
    "pdbpp>=0.12.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pyclean>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
